# =============================================================
# Service: Expose your app inside and outside the cluster
# =============================================================
# LEARN: Services provide stable networking for Pods.
# Pods are ephemeral (they come and go), but Services give
# a stable IP and DNS name to reach your application.
#
# Types:
#   ClusterIP  - Internal only (default)
#   NodePort   - Expose on each node's IP at a static port
#   LoadBalancer - External load balancer (cloud providers)
# =============================================================

# --- ClusterIP Service (internal communication) ---
apiVersion: v1
kind: Service
metadata:
  name: poc-app-clusterip
  namespace: poc-app
  labels:
    app: poc-app
spec:
  type: ClusterIP
  selector:
    app: poc-app
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP

---
# --- NodePort Service (access from your machine) ---
# LEARN: NodePort exposes the service on a port (30000-32767)
# on every node in the cluster. With Minikube, use:
#   minikube service poc-app-nodeport -n poc-app
apiVersion: v1
kind: Service
metadata:
  name: poc-app-nodeport
  namespace: poc-app
  labels:
    app: poc-app
spec:
  type: NodePort
  selector:
    app: poc-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
