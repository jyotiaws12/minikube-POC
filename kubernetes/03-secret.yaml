# =============================================================
# Secret: Store sensitive data (passwords, tokens, keys)
# =============================================================
# LEARN: Secrets are similar to ConfigMaps but designed for
# sensitive data. Values are base64-encoded (NOT encrypted!).
# In production, use tools like Sealed Secrets or Vault.
#
# To encode: echo -n "my-value" | base64
# To decode: echo "bXktdmFsdWU=" | base64 -d
# =============================================================
apiVersion: v1
kind: Secret
metadata:
  name: poc-app-secret
  namespace: poc-app
  labels:
    app: poc-app
type: Opaque
data:
  # "super-secret-key-123" base64-encoded
  SECRET_KEY: c3VwZXItc2VjcmV0LWtleS0xMjM=
  # "db-password-456" base64-encoded
  DB_PASSWORD: ZGItcGFzc3dvcmQtNDU2
