[project]
name = "ollama-multi-agent-demo"
version = "0.1.0"
description = "Three Ollama-backed agents (PM, Developer, Tester) collaborate to ship a feature."
requires-python = ">=3.10"
dependencies = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
