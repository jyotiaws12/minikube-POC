name: ollama-multi-agent-demo CI

on:
  push:
    branches: [main]
    paths:
      - "ollama-multi-agent-demo/**"
      - ".github/workflows/ollama-multi-agent-demo.yml"
  pull_request:
    paths:
      - "ollama-multi-agent-demo/**"
      - ".github/workflows/ollama-multi-agent-demo.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ollama-multi-agent-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
